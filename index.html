<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0079d3" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>ANI Boss Console</title>
    <style>
      #app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-fill-1, #f7f8fa);
        color: rgb(var(--primary-6, 0, 121, 211));
      }

      #app-boot-progress {
        display: flex;
        gap: 6px;
      }

      #app-boot-progress span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }

      #app-boot-progress span:nth-child(2) {
        animation-delay: 0.15s;
      }

      #app-boot-progress span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes boot-pulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-boot-progress span {
          opacity: 0.6;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot" role="status" aria-live="polite" aria-label="正在加载控制台">
        <div id="app-boot-progress" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
